Paths:
  # Paths should be relative to the root of the backend.
  repo_list_path: "./repos.txt"
  env_path: "./.env"
  repo_dest_dir: "./data/repos"
  database_dir: "./data/database"
  

Server:
  host: "0.0.0.0"
  port: 8000
  development: True

Logging:
  show_time: False
  levels:
    api: "INFO"
    rag: "INFO"
    utils: "WARNING"

LLM:
  provider: "groq"
  model_name: "qwen/qwen3-32b"

